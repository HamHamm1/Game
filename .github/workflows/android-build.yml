name: Android Debug APK (Phase 1 + 1b)

# Cloud build of the Godot 4.3 project into an installable Android debug APK,
# operable entirely from a phone (no PC needed):
#   push to the dev branch  -> builds automatically, OR
#   Actions tab -> this workflow -> "Run workflow"  (workflow_dispatch)
# then download the "aletheia-phase1-debug-apk" artifact from the run.
#
# It uses the project's EXISTING export config (godot/export_presets.cfg)
# unchanged. The Android SDK path + a debug keystore are supplied to Godot
# via editor settings at build time (CI only) — the preset is not modified.
#
# Producing this APK is NOT "ANDROID VERIFIED": that requires installing it
# on a real device and passing godot/ANDROID_VERIFICATION.md (A–T).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/rpg-architecture-design-eut455
    paths:
      - "godot/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_TEMPLATES_DIR: "4.3.stable"
  PROJECT_DIR: "godot"
  PRESET: "Android"
  OUTPUT: "aletheia-phase1-debug.apk"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (command-line tools)
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb" && echo "adb OK"
          ls "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" && echo "apksigner OK"

      - name: Install Godot ${{ env.GODOT_VERSION }} (headless) + export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}_export_templates.tpz"
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}"
          mkdir -p "$TDIR"
          unzip -q templates.tpz -d _tpl
          cp -r _tpl/templates/. "$TDIR/"
          ls "$TDIR" | grep -i android

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor settings (SDK + keystore)
        run: |
          mkdir -p "$HOME/.config/godot"
          {
            printf '[gd_resource type="EditorSettings" format=3]\n\n'
            printf '[resource]\n'
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_SDK_ROOT"
            printf 'export/android/debug_keystore = "%s"\n' "$HOME/debug.keystore"
            printf 'export/android/debug_keystore_user = "androiddebugkey"\n'
            printf 'export/android/debug_keystore_pass = "android"\n'
          } > "$HOME/.config/godot/editor_settings-4.3.tres"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Import project (headless)
        run: godot --headless --path "$PROJECT_DIR" --import || true

      - name: Export Android debug APK
        run: |
          mkdir -p "$PROJECT_DIR/build"
          godot --headless --path "$PROJECT_DIR" \
            --export-debug "$PRESET" "$GITHUB_WORKSPACE/$PROJECT_DIR/build/$OUTPUT"

      - name: Verify APK was produced
        run: |
          APK="$PROJECT_DIR/build/$OUTPUT"
          if [ ! -f "$APK" ]; then
            echo "::error::APK was not produced by the export step."
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "Built $APK ($SIZE bytes)"
          {
            echo "### ✅ Android debug APK built"
            echo ""
            echo "- File: \`$OUTPUT\` ($SIZE bytes)"
            echo "- Download it from this run's **Artifacts** → \`aletheia-phase1-debug-apk\`."
            echo "- Install on your phone, then run the on-device checklist (godot/ANDROID_VERIFICATION.md)."
            echo "- Building the APK is **not** ANDROID VERIFIED — the device tests are."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose APK (temporary)
        if: always()
        run: |
          set +e
          APK="$PROJECT_DIR/build/$OUTPUT"
          BT="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          [ -f "$APK" ] || { echo "no APK to diagnose"; exit 0; }
          {
            echo "==== INTEGRITY ===="
            sha256sum "$APK"
            echo "size=$(stat -c%s "$APK") bytes"
            if unzip -t "$APK" >/dev/null 2>&1; then echo "zip: OK"; else echo "zip: CORRUPT"; fi
            echo
            echo "==== BADGING (package / sdk / abis / perms) ===="
            "$BT/aapt2" dump badging "$APK" 2>&1
            echo
            echo "==== USES-SDK (manifest) ===="
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" 2>&1 | grep -iE "manifest|uses-sdk|SdkVersion|compileSdk|application |activity |android:exported|MAIN|LAUNCHER" | head -50
            echo
            echo "==== ABIs ===="
            unzip -l "$APK" | grep -E "lib/"
            echo
            echo "==== SIGNING (apksigner verify) ===="
            "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1
            echo "apksigner_verify_exit=$?"
            echo
            echo "==== SIGNING (verify as min-sdk 21) ===="
            "$BT/apksigner" verify --min-sdk-version 21 "$APK" 2>&1
            echo "apksigner_minsdk21_exit=$?"
            echo
            echo "==== META-INF (v1 signature files) ===="
            unzip -l "$APK" | grep -E "META-INF/" || echo "(no META-INF entries)"
          } 2>&1 | tee "$PROJECT_DIR/build/apk-diagnostics.txt"
          {
            echo "### APK diagnostics"
            echo '```'
            cat "$PROJECT_DIR/build/apk-diagnostics.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aletheia-phase1-debug-apk
          path: godot/build/aletheia-phase1-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-diagnostics
          path: godot/build/apk-diagnostics.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Report failure
        if: failure()
        run: |
          {
            echo "### ❌ Android build failed"
            echo ""
            echo "See the failed step's log above. Common causes:"
            echo "- Android SDK package install failed (licenses / network)."
            echo "- Godot or export-template download failed."
            echo "- A project script/import error (run tools/run_validation.sh locally)."
          } >> "$GITHUB_STEP_SUMMARY"
